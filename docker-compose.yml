services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idshield
      POSTGRES_USER: idshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetic-demo-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idshield -d idshield"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://idshield:${POSTGRES_PASSWORD:-synthetic-demo-local-only}@db:5432/idshield
      IDSHIELD_DATA_DIR: /data
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      IDSHIELD_ALLOW_TUNNEL: "1"
    volumes:
      - engine-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
  engine-data:
